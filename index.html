<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프런트오피스 스케쥴러</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts (Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white pb-10">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between py-3 sm:py-0 sm:h-16 gap-3 sm:gap-0">
        <!-- Title & Status -->
        <div class="flex items-center justify-between sm:justify-start space-x-3">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-100">
              <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </div>
            <div>
              <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-800 bg-clip-text text-transparent">
                프런트오피스 스케쥴러
              </h1>
              <p class="text-xs text-slate-500 hidden sm:block">인스타그램 매거진 1·2팀 통합 일정 관리 시스템</p>
            </div>
          </div>
          <span id="syncStatus" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5 animate-pulse"></span>
            연동 중...
          </span>
        </div>

        <!-- Team Leads Info & Action Buttons -->
        <div class="flex items-center justify-between sm:justify-end space-x-3">
          <div class="hidden md:flex items-center space-x-2 bg-slate-100 p-1.5 rounded-lg border border-slate-200/60 text-xs font-medium text-slate-600">
            <div class="flex items-center space-x-1.5 bg-white px-2.5 py-1 rounded shadow-xs">
              <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
              <span>1팀: <strong class="text-slate-800">박지훈</strong></span>
            </div>
            <div class="flex items-center space-x-1.5 bg-white px-2.5 py-1 rounded shadow-xs">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>2팀: <strong class="text-slate-800">김정훈</strong></span>
            </div>
          </div>

          <button id="shareBtn" class="inline-flex items-center justify-center space-x-1.5 px-3 py-2 rounded-lg text-xs font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
            <i data-lucide="share-2" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>공유하기</span>
          </button>
          <button id="openModalBtn" class="inline-flex items-center justify-center space-x-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>일정 추가</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTROL BAR -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 sm:mt-6 flex-1 w-full">
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs mb-6 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Month Navigation -->
        <div class="flex items-center justify-between md:justify-start space-x-4">
          <div class="flex items-center space-x-1">
            <button id="prevMonth" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 active:bg-slate-200 transition">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <h2 id="currentMonthYear" class="text-lg font-bold text-slate-800 min-w-[120px] text-center">
              2026년 9월
            </h2>
            <button id="nextMonth" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 active:bg-slate-200 transition">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
          <button id="todayBtn" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">
            오늘
          </button>
        </div>

        <!-- Filters & View Toggle -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Team Filter -->
          <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-medium text-slate-600">
            <button class="filter-team-btn px-2.5 py-1 rounded-md transition font-semibold bg-white text-slate-800 shadow-xs" data-team="all">전체 팀</button>
            <button class="filter-team-btn px-2.5 py-1 rounded-md transition hover:text-slate-900" data-team="1팀">1팀 (박지훈)</button>
            <button class="filter-team-btn px-2.5 py-1 rounded-md transition hover:text-slate-900" data-team="2팀">2팀 (김정훈)</button>
          </div>

          <!-- Format Filter -->
          <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-medium text-slate-600">
            <button class="filter-format-btn px-2.5 py-1 rounded-md transition font-semibold bg-white text-slate-800 shadow-xs" data-format="all">전체 포맷</button>
            <button class="filter-format-btn px-2.5 py-1 rounded-md transition hover:text-slate-900" data-format="기획 콘텐츠">기획</button>
            <button class="filter-format-btn px-2.5 py-1 rounded-md transition hover:text-slate-900" data-format="릴스 콘텐츠">릴스</button>
          </div>

          <!-- View Toggle -->
          <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-medium text-slate-600 ml-auto md:ml-0">
            <button id="calendarViewBtn" class="view-btn px-2.5 py-1 rounded-md transition font-semibold bg-white text-slate-800 shadow-xs">
              <i data-lucide="calendar" class="w-3.5 h-3.5 inline mr-1"></i>달력
            </button>
            <button id="listViewBtn" class="view-btn px-2.5 py-1 rounded-md transition hover:text-slate-900">
              <i data-lucide="list" class="w-3.5 h-3.5 inline mr-1"></i>타임라인
            </button>
          </div>
        </div>

      </div>

      <!-- Conflict Alert Banner -->
      <div id="conflictAlertBanner" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start space-x-3 text-xs text-amber-900">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <strong class="font-semibold text-amber-800">일정 중복 감지:</strong>
          <span id="conflictAlertText">이번 달에 1팀과 2팀의 발행 일정이 동일한 날짜에 상충하는 구역이 있습니다. 아래 달력에서 ⚠️ 표시를 확인하세요.</span>
        </div>
      </div>
    </div>

    <!-- CALENDAR VIEW CONTAINER -->
    <div id="calendarContainer" class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <!-- Weekday Header -->
      <div class="calendar-grid border-b border-slate-200 bg-slate-50 text-center text-xs font-bold text-slate-500 py-2.5">
        <div class="text-rose-500">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-indigo-600">토</div>
      </div>
      <!-- Days Grid -->
      <div id="calendarGrid" class="calendar-grid divide-x divide-y divide-slate-100">
        <!-- JS Grid Rendered Here -->
      </div>
    </div>

    <!-- LIST VIEW CONTAINER -->
    <div id="listContainer" class="hidden bg-white rounded-2xl border border-slate-200 shadow-xs p-4 sm:p-6 space-y-4">
      <h3 class="text-sm font-bold text-slate-800 flex items-center space-x-2">
        <i data-lucide="clock" class="w-4 h-4 text-indigo-600"></i>
        <span>월간 일정 타임라인</span>
      </h3>
      <div id="listTimeline" class="space-y-3 divide-y divide-slate-100">
        <!-- JS List Rendered Here -->
      </div>
    </div>
  </main>

  <!-- ADD / EDIT EVENT MODAL -->
  <div id="eventModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base">새 콘텐츠 일정 추가</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="eventForm" class="p-6 space-y-4">
        <input type="hidden" id="eventId">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">콘텐츠 제목</label>
          <input type="text" id="eventTitle" required placeholder="예: [가을 특집] 20대 패션 트렌드 모음" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">담당 팀</label>
            <select id="eventTeam" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="1팀">1팀 (박지훈 팀장)</option>
              <option value="2팀">2팀 (김정훈 팀장)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">포맷 유형</label>
            <select id="eventFormat" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="기획 콘텐츠">기획 콘텐츠</option>
              <option value="릴스 콘텐츠">릴스 콘텐츠</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">발행 예정일</label>
          <input type="date" id="eventDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">상세 메모 (선택)</label>
          <textarea id="eventMemo" rows="2" placeholder="참고사항, 레퍼런스 링크 등 기재" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-between space-x-2">
          <button type="button" id="deleteModalEventBtn" class="hidden px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg text-xs transition items-center space-x-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>일정 삭제</span>
          </button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-lg text-xs transition">취소</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs shadow-sm transition">저장하기</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div id="deleteConfirmModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xs overflow-hidden text-center p-6 space-y-4">
      <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="trash-2" class="w-6 h-6"></i>
      </div>
      <div>
        <h4 class="text-base font-bold text-slate-800">일정을 삭제하시겠습니까?</h4>
        <p class="text-xs text-slate-500 mt-1">삭제된 일정 데이터는 복구할 수 없습니다.</p>
      </div>
      <div class="flex items-center justify-center space-x-2">
        <button id="cancelDeleteBtn" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs transition">취소</button>
        <button id="confirmDeleteBtn" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg text-xs shadow-sm transition">삭제</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-xs opacity-0 transition-opacity duration-300 pointer-events-none">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">처리되었습니다.</span>
  </div>

  <!-- FIREBASE APPLICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1nPVP5JFGGZgecqYXwNG_EBW-Rzm1f3A",
      authDomain: "frontoffice-f0527.firebaseapp.com",
      projectId: "frontoffice-f0527",
      storageBucket: "frontoffice-f0527.firebasestorage.app",
      messagingSenderId: "103538813933",
      appId: "1:103538813933:web:9e84a81f2b2a17245bd5e4",
      measurementId: "G-9V1DSFJL3D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const eventsCol = collection(db, "front_office_events");

    // State Variables
    let events = [];
    let currentDate = new Date();
    let currentTeamFilter = 'all';
    let currentFormatFilter = 'all';
    let currentView = 'calendar';
    let pendingDeleteId = null;
    let firebaseConnected = false;

    // Initialize App & Firestore Real-time Listener
    function initApp() {
      lucide.createIcons();
      setupEventListeners();

      // Setup Realtime Firestore Listener
      try {
        const q = query(eventsCol);
        
        const unsubscribe = onSnapshot(q, (snapshot) => {
          events = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          firebaseConnected = true;
          updateSyncStatus(true);
          render();
          console.log("✅ Firestore 연동 성공:", events.length + "개 일정");
        }, (error) => {
          firebaseConnected = false;
          updateSyncStatus(false);
          console.error("❌ Firestore 오류:", error.message);
          showToast("Firebase 연결 실패. 로컬 모드로 작동합니다.", "warning");
          render();
        });

        // 페이지 나갈 때 리스너 정리
        window.addEventListener('beforeunload', () => {
          unsubscribe();
        });
      } catch (e) {
        firebaseConnected = false;
        updateSyncStatus(false);
        console.error("Firebase 초기화 오류:", e);
      }
    }

    function updateSyncStatus(isConnected) {
      const statusEl = document.getElementById('syncStatus');
      if (isConnected) {
        statusEl.className = 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
        statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>실시간 연동 중';
      } else {
        statusEl.className = 'inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200';
        statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>로컬 모드';
      }
    }

    // UI Render Dispatcher
    function render() {
      updateHeaderMonth();
      if (currentView === 'calendar') {
        renderCalendar();
      } else {
        renderTimeline();
      }
      checkConflicts();
      lucide.createIcons();
    }

    function updateHeaderMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      document.getElementById('currentMonthYear').textContent = `${year}년 ${month}월`;
    }

    // Render Calendar View
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      // Render Previous Month Padding Days
      for (let i = firstDay - 1; i >= 0; i--) {
        const dayNum = prevLastDate - i;
        const cell = document.createElement('div');
        cell.className = 'min-h-[90px] sm:min-h-[110px] p-1 sm:p-2 bg-slate-50/50 text-slate-300 text-xs';
        cell.innerHTML = `<span class="font-medium">${dayNum}</span>`;
        grid.appendChild(cell);
      }

      // Render Current Month Days
      const todayStr = new Date().toISOString().split('T')[0];

      for (let date = 1; date <= lastDate; date++) {
        const monthStr = String(month + 1).padStart(2, '0');
        const dateStr = String(date).padStart(2, '0');
        const formattedDate = `${year}-${monthStr}-${dateStr}`;

        const isToday = formattedDate === todayStr;

        // Filter events for this day
        const dayEvents = events.filter(e => {
          if (e.date !== formattedDate) return false;
          if (currentTeamFilter !== 'all' && e.team !== currentTeamFilter) return false;
          if (currentFormatFilter !== 'all' && e.format !== currentFormatFilter) return false;
          return true;
        });

        // Detect Conflict (Both Team 1 and Team 2 have schedules)
        const team1Has = dayEvents.some(e => e.team === '1팀');
        const team2Has = dayEvents.some(e => e.team === '2팀');
        const hasConflict = team1Has && team2Has;

        const cell = document.createElement('div');
        cell.className = `min-h-[90px] sm:min-h-[110px] p-1 sm:p-2 bg-white transition hover:bg-slate-50/80 flex flex-col justify-between ${isToday ? 'bg-indigo-50/30 ring-1 ring-indigo-400 inset-0' : ''}`;
        
        let cellContent = `
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-semibold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : 'text-slate-700'}">${date}</span>
              ${hasConflict ? '<span class="text-amber-500 font-bold text-xs" title="1팀과 2팀 일정이 겹침!">⚠️</span>' : ''}
            </div>
            <div class="space-y-1">
        `;

        dayEvents.forEach(ev => {
          const isTeam1 = ev.team === '1팀';
          const teamBadgeBg = isTeam1 ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700';
          const dotBg = isTeam1 ? 'bg-indigo-500' : 'bg-emerald-500';
          const formatBadge = ev.format === '릴스 콘텐츠' ? '🎬' : '📝';

          cellContent += `
            <div data-id="${ev.id}" class="event-card group flex items-center justify-between p-1 rounded-md border ${teamBadgeBg} text-[11px] font-medium leading-tight cursor-pointer hover:shadow-xs transition">
              <div class="truncate flex items-center space-x-1 flex-1 pr-1">
                <span class="w-1.5 h-1.5 rounded-full ${dotBg} shrink-0"></span>
                <span class="font-bold text-[10px] opacity-80">${ev.team}</span>
                <span class="truncate">${ev.title}</span>
              </div>
              <div class="flex items-center space-x-1 shrink-0">
                <span class="text-[10px]">${formatBadge}</span>
                <button data-id="${ev.id}" class="delete-card-btn opacity-0 group-hover:opacity-100 p-0.5 hover:text-rose-600 text-slate-400 transition">
                  <i data-lucide="x" class="w-3 h-3"></i>
                </button>
              </div>
            </div>
          `;
        });

        cellContent += `</div></div>`;
        
        // Quick add button
        cellContent += `
          <button data-date="${formattedDate}" class="quick-add-btn text-[10px] text-slate-400 hover:text-indigo-600 font-medium py-0.5 text-center w-full opacity-0 hover:opacity-100 transition mt-1">
            + 일정 추가
          </button>
        `;

        cell.innerHTML = cellContent;
        grid.appendChild(cell);
      }

      // Next Month Padding Days
      const totalCells = firstDay + lastDate;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= nextDays; i++) {
        const cell = document.createElement('div');
        cell.className = 'min-h-[90px] sm:min-h-[110px] p-1 sm:p-2 bg-slate-50/50 text-slate-300 text-xs';
        cell.innerHTML = `<span class="font-medium">${i}</span>`;
        grid.appendChild(cell);
      }
    }

    // Render Timeline View
    function renderTimeline() {
      const timeline = document.getElementById('listTimeline');
      timeline.innerHTML = '';

      const filteredEvents = events.filter(e => {
        if (currentTeamFilter !== 'all' && e.team !== currentTeamFilter) return false;
        if (currentFormatFilter !== 'all' && e.format !== currentFormatFilter) return false;
        return true;
      }).sort((a, b) => new Date(a.date) - new Date(b.date));

      if (filteredEvents.length === 0) {
        timeline.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">등록된 일정이 없습니다.</div>`;
        return;
      }

      filteredEvents.forEach(ev => {
        const isTeam1 = ev.team === '1팀';
        const teamBadgeBg = isTeam1 ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800';

        const item = document.createElement('div');
        item.className = 'pt-3 flex items-start justify-between hover:bg-slate-50 p-2 rounded-xl transition';
        item.innerHTML = `
          <div class="flex items-start space-x-3">
            <div class="bg-slate-100 px-2.5 py-1.5 rounded-lg text-center shrink-0">
              <span class="text-xs font-bold text-slate-700 block">${ev.date.split('-')[1]}.${ev.date.split('-')[2]}</span>
              <span class="text-[10px] text-slate-400 block">${ev.format}</span>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${teamBadgeBg}">${ev.team} (${isTeam1 ? '박지훈' : '김정훈'})</span>
                <h4 class="text-sm font-bold text-slate-800">${ev.title}</h4>
              </div>
              ${ev.memo ? `<p class="text-xs text-slate-500 mt-1">${ev.memo}</p>` : ''}
            </div>
          </div>
          <div class="flex items-center space-x-1">
            <button data-id="${ev.id}" class="edit-timeline-btn p-1.5 text-slate-400 hover:text-indigo-600 rounded-md transition">
              <i data-lucide="edit-3" class="w-4 h-4"></i>
            </button>
            <button data-id="${ev.id}" class="delete-timeline-btn p-1.5 text-slate-400 hover:text-rose-600 rounded-md transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        timeline.appendChild(item);
      });
    }

    // Conflict Check Banner logic
    function checkConflicts() {
      const banner = document.getElementById('conflictAlertBanner');
      const text = document.getElementById('conflictAlertText');

      const dateMap = {};
      events.forEach(e => {
        if (!dateMap[e.date]) dateMap[e.date] = new Set();
        dateMap[e.date].add(e.team);
      });

      const conflictDates = Object.keys(dateMap).filter(d => dateMap[d].size > 1);

      if (conflictDates.length > 0) {
        banner.classList.remove('hidden');
        text.textContent = `이번 달 ${conflictDates.join(', ')} 에 1팀과 2팀의 발행 일정이 상충하고 있습니다. 일정을 조정하세요!`;
      } else {
        banner.classList.add('hidden');
      }
    }

    // Modal Control & Event Listeners
    function setupEventListeners() {
      const modal = document.getElementById('eventModal');
      const deleteModal = document.getElementById('deleteConfirmModal');
      const form = document.getElementById('eventForm');

      // Open Modal for New Event
      document.getElementById('openModalBtn').addEventListener('click', () => {
        openModal();
      });

      // Event Card Clicks & Actions
      document.addEventListener('click', (e) => {
        const qAdd = e.target.closest('.quick-add-btn');
        if (qAdd) {
          const date = qAdd.dataset.date;
          openModal(null, date);
          return;
        }

        const card = e.target.closest('.event-card');
        const deleteBtn = e.target.closest('.delete-card-btn');

        if (deleteBtn) {
          e.stopPropagation();
          const id = deleteBtn.dataset.id;
          confirmDelete(id);
          return;
        }

        if (card) {
          const id = card.dataset.id;
          const ev = events.find(item => item.id === id);
          if (ev) openModal(ev);
          return;
        }

        const editTimelineBtn = e.target.closest('.edit-timeline-btn');
        const deleteTimelineBtn = e.target.closest('.delete-timeline-btn');

        if (editTimelineBtn) {
          const id = editTimelineBtn.dataset.id;
          const ev = events.find(item => item.id === id);
          if (ev) openModal(ev);
        }

        if (deleteTimelineBtn) {
          const id = deleteTimelineBtn.dataset.id;
          confirmDelete(id);
        }
      });

      // Close Modal Actions
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

      // Save Form
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('eventId').value;
        const eventData = {
          title: document.getElementById('eventTitle').value,
          team: document.getElementById('eventTeam').value,
          format: document.getElementById('eventFormat').value,
          date: document.getElementById('eventDate').value,
          memo: document.getElementById('eventMemo').value,
          createdAt: new Date().toISOString()
        };

        if (id) {
          try {
            await updateDoc(doc(db, "front_office_events", id), eventData);
            showToast('일정이 수정되었습니다.');
          } catch (err) {
            console.error("수정 오류:", err);
            showToast('오류: ' + err.message, "warning");
          }
        } else {
          try {
            await addDoc(eventsCol, eventData);
            showToast('새 일정이 등록되었습니다.');
          } catch (err) {
            console.error("추가 오류:", err);
            showToast('오류: ' + err.message, "warning");
          }
        }

        closeModal();
      });

      // Delete in Edit Modal
      document.getElementById('deleteModalEventBtn').addEventListener('click', () => {
        const id = document.getElementById('eventId').value;
        if (id) {
          closeModal();
          confirmDelete(id);
        }
      });

      // Delete Confirm Actions
      document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
        deleteModal.classList.add('hidden');
        pendingDeleteId = null;
      });

      document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
        if (pendingDeleteId) {
          try {
            await deleteDoc(doc(db, "front_office_events", pendingDeleteId));
            showToast('일정이 삭제되었습니다.');
          } catch (err) {
            console.error("삭제 오류:", err);
            showToast('오류: ' + err.message, "warning");
          }
        }
        deleteModal.classList.add('hidden');
        pendingDeleteId = null;
      });

      // Navigation Buttons
      document.getElementById('prevMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        render();
      });
      document.getElementById('nextMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        render();
      });
      document.getElementById('todayBtn').addEventListener('click', () => {
        currentDate = new Date();
        render();
      });

      // Team Filters
      document.querySelectorAll('.filter-team-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-team-btn').forEach(b => {
            b.classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
            b.classList.add('hover:text-slate-900');
          });
          e.target.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
          currentTeamFilter = e.target.dataset.team;
          render();
        });
      });

      // Format Filters
      document.querySelectorAll('.filter-format-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-format-btn').forEach(b => {
            b.classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
            b.classList.add('hover:text-slate-900');
          });
          e.target.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
          currentFormatFilter = e.target.dataset.format;
          render();
        });
      });

      // View Toggle
      document.getElementById('calendarViewBtn').addEventListener('click', () => {
        currentView = 'calendar';
        document.getElementById('calendarContainer').classList.remove('hidden');
        document.getElementById('listContainer').classList.add('hidden');
        document.getElementById('calendarViewBtn').classList.add('bg-white', 'text-slate-800', 'shadow-xs');
        document.getElementById('listViewBtn').classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
        render();
      });

      document.getElementById('listViewBtn').addEventListener('click', () => {
        currentView = 'list';
        document.getElementById('calendarContainer').classList.add('hidden');
        document.getElementById('listContainer').classList.remove('hidden');
        document.getElementById('listViewBtn').classList.add('bg-white', 'text-slate-800', 'shadow-xs');
        document.getElementById('calendarViewBtn').classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
        render();
      });

      // Share Link Button
      document.getElementById('shareBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('페이지 링크가 클립보드에 복사되었습니다!');
        }).catch(() => {
          showToast('링크 복사에 실패했습니다.');
        });
      });
    }

    function openModal(eventObj = null, defaultDate = null) {
      const modal = document.getElementById('eventModal');
      const deleteBtn = document.getElementById('deleteModalEventBtn');
      const modalTitle = document.getElementById('modalTitle');

      if (eventObj) {
        modalTitle.textContent = '콘텐츠 일정 수정';
        document.getElementById('eventId').value = eventObj.id;
        document.getElementById('eventTitle').value = eventObj.title;
        document.getElementById('eventTeam').value = eventObj.team;
        document.getElementById('eventFormat').value = eventObj.format;
        document.getElementById('eventDate').value = eventObj.date;
        document.getElementById('eventMemo').value = eventObj.memo || '';
        deleteBtn.classList.remove('hidden');
        deleteBtn.classList.add('flex');
      } else {
        modalTitle.textContent = '새 콘텐츠 일정 추가';
        document.getElementById('eventForm').reset();
        document.getElementById('eventId').value = '';
        document.getElementById('eventDate').value = defaultDate || new Date().toISOString().split('T')[0];
        deleteBtn.classList.add('hidden');
        deleteBtn.classList.remove('flex');
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('eventModal').classList.add('hidden');
    }

    function confirmDelete(id) {
      pendingDeleteId = id;
      document.getElementById('deleteConfirmModal').classList.remove('hidden');
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // App Init
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
